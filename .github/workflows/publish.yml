# Publishes domain-hound to npm with Trusted Publishing (OIDC): no npm token or other secret is stored.
# Active once the package exists on npm and this repository and workflow are registered as its trusted publisher.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use npm 11.5.1 or later
        run: |
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1
          npm --version

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package version v$VERSION." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm publish --provenance
