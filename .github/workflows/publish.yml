# Publishes domain-hound to npm with Trusted Publishing (OIDC): no npm token is stored.
# Active once the package exists on npm and this repository and workflow are registered as its trusted publisher.
# After npm: wait until `npm view domain-hound@<version>` (fresh npm cache every try) lists the new version three times
# in a row, start that exact version through npx as a smoke test (retried with fresh caches while npx still reports
# ETARGET or E404), then publish server.json to the MCP Registry. Nothing here requests the plain tarball URL before npx
# installs it: a 404 gets cached by the CDN.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use npm 11.5.1 or later
        run: |
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1
          npm --version

      - name: Check that the tag matches the package and server.json versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package version v$VERSION." >&2
            exit 1
          fi
          node -e "const s = require('./server.json'); const v = process.argv[1]; if (s.version !== v || s.packages.some(p => p.version !== v)) { console.error('server.json does not carry version ' + v); process.exit(1); }" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm test

      - run: npm publish --provenance

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    # 15 minutes of waiting plus 10 of smoke retries, with room for checkout and Node setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # npm view only reads package metadata. The smoke test also checks the metadata and tarball used by npx.
      - name: Wait until npm lists the new version
        timeout-minutes: 15
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          total="${READY_TIMEOUT_SECONDS:-900}"
          per_try="${READY_ATTEMPT_SECONDS:-60}"
          poll="${READY_POLL_SECONDS:-10}"
          deadline=$(( SECONDS + total ))
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          streak=0
          attempt=0
          while :; do
            remaining=$(( deadline - SECONDS ))
            if [ "$remaining" -le 0 ]; then break; fi
            attempt=$(( attempt + 1 ))
            cache="$work/npm-cache-$attempt"
            mkdir "$cache"
            limit=$(( remaining < per_try ? remaining : per_try ))
            status=0
            got="$(timeout -s KILL "$limit" npm view "domain-hound@${VERSION}" version \
              --cache "$cache" --prefer-online --fetch-retries=0 --no-update-notifier 2>"$work/stderr")" || status=$?
            rm -rf "$cache"
            if [ "$status" -eq 0 ] && [ "$got" = "$VERSION" ]; then
              streak=$(( streak + 1 ))
              echo "Try ${attempt}: npm view lists ${VERSION} (${streak} of 3 in a row)."
              if [ "$streak" -eq 3 ]; then exit 0; fi
            else
              streak=0
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                reason="npm view did not answer within ${limit} s"
              elif [ "$status" -ne 0 ]; then
                reason="npm view exit ${status}: $(head -n 2 "$work/stderr" | tr '\n' ' ')"
              else
                reason="npm view answered '${got}'"
              fi
              echo "Try ${attempt}: not listed yet (${reason})."
            fi
            remaining=$(( deadline - SECONDS ))
            if [ "$remaining" -le 0 ]; then break; fi
            sleep "$(( remaining < poll ? remaining : poll ))"
          done
          echo "domain-hound ${VERSION} was not listed by npm view 3 times in a row within ${total} s (${attempt} tries)." >&2
          exit 1

      - name: Start the published version through npx and list its tools
        timeout-minutes: 12
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: node scripts/package-smoke.mjs --published "$VERSION"

  mcp-registry:
    needs: [publish, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The owner adds the secret MCP_REGISTRY_PRIVATE_KEY: the hex Ed25519 private key whose public key is served at
      # https://domainhound.dev/.well-known/mcp-registry-auth. Without it this job ends with a notice.
      - name: Publish server.json to the MCP Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::notice title=MCP Registry not updated::Add the MCP_REGISTRY_PRIVATE_KEY repository secret to publish server.json automatically, or run mcp-publisher by hand."
            exit 0
          fi
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          curl -fsSL --max-time 60 -o "$archive" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05 "$archive" | sha256sum -c -
          tar -xzf "$archive" mcp-publisher
          MCP_PRIVATE_KEY="$MCP_REGISTRY_PRIVATE_KEY" ./mcp-publisher login http --domain domainhound.dev
          ./mcp-publisher publish
