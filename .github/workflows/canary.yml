name: Canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npm ci

      - name: Run the canary
        id: canary
        continue-on-error: true
        run: node scripts/canary.mjs > canary.json

      - name: Show the summary
        if: always()
        run: cat canary.json || true

      - name: Open or update one issue per broken source
        if: failure() || steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! jq -e '.failures' canary.json > /dev/null 2>&1; then
            echo '{"failures":["canary run"],"checks":[]}' > canary.json
          fi
          jq -r '.failures[]' canary.json | while IFS= read -r source; do
            title="Canary: ${source} broken"
            detail=$(jq -r --arg source "$source" '.checks[] | select(.source == $source) | .detail // "no detail"' canary.json)
            body=$(printf '%s\n\nDetail: %s\nRun: %s\n' "$title" "${detail:-see the run log}" "$RUN_URL")
            number=$(gh issue list --state open --limit 100 --search "\"${title}\" in:title" --json number,title |
              jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done

      - name: Fail the run when a source is broken
        if: steps.canary.outcome == 'failure'
        run: exit 1
